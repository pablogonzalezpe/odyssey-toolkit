services:
  destiny:
    build:
      context: .
      dockerfile: Dockerfile.destiny
    container_name: destiny-tls
    hostname: destiny
    networks:
      internal-net:
        ipv4_address: 10.10.20.2

  jumpbox:
    build:
      context: ../..
      dockerfile: docker/lab-reverse-tls/Dockerfile.jumpbox
    container_name: jumpbox-tls
    hostname: jumpbox
    depends_on:
      - destiny
      - pentester
    volumes:
      - certs:/certs
    networks:
      pentest-net:
        ipv4_address: 10.10.10.2
      internal-net:
        ipv4_address: 10.10.20.3

  pentester:
    build:
      context: ../..
      dockerfile: docker/lab-reverse-tls/Dockerfile.pentester
    container_name: pentester-tls
    hostname: pentester
    stdin_open: true
    tty: true
    volumes:
      - certs:/certs
    networks:
      pentest-net:
        ipv4_address: 10.10.10.3

volumes:
  certs:

networks:
  pentest-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
  internal-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24
